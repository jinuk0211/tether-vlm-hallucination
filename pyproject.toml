[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tether"
version = "0.1.0"
description = "TETHER: steering vision-language models where the image is read less"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.8,<2.9",
  "torchvision==0.23.0",
  "transformers==5.20.2",
  "accelerate>=1.0,<2",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
eval = ["nltk>=3.9,<4", "pycocotools>=2.0.8", "PatternLite==3.6", "pyyaml"]
baselines = ["captum", "scikit-learn", "pandas", "shortuuid", "tqdm", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tether = ["resources/*.json"]

[tool.black]
line-length = 110
